services:
  - type: web
    name: brewflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate
    preDeployCommand: npm run prisma:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Render has no free plan for background workers, so on the free tier
      # the BullMQ worker runs in-process alongside the API (see server.js).
      # Locally (docker-compose) this stays unset and the worker runs as its
      # own container.
      - key: RUN_WORKER_INLINE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: brewflow-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: brewflow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: brewflow-redis
          property: port

  - type: keyvalue
    name: brewflow-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: brewflow-postgres
    databaseName: brewflow
    user: brewflow_user
    plan: free
