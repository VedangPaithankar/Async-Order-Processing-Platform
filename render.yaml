services:
  - type: web
    name: brewflow-api
    runtime: node
    plan: free
    rootDir: backend
    # preDeployCommand needs a paid plan. DATABASE_URL is guaranteed to be
    # populated at runtime, so run the migration right before boot instead
    # (prisma migrate deploy is idempotent — a no-op if nothing is pending).
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm run prisma:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Render has no free plan for background workers, so on the free tier
      # the BullMQ worker runs in-process alongside the API (see server.js).
      # Locally (docker-compose) this stays unset and the worker runs as its
      # own container.
      - key: RUN_WORKER_INLINE
        value: "true"
      # Render's free Postgres expires 30 days after creation and gets
      # suspended. Using an external free provider (Neon) instead, which
      # has no expiry — set the actual connection string manually in the
      # Render dashboard (Environment tab), not here.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: brewflow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: brewflow-redis
          property: port

  - type: keyvalue
    name: brewflow-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

# Postgres is no longer Render-managed (see DATABASE_URL above) — Render's
# free Postgres expires after 30 days, so the database now lives on Neon
# (neon.tech), which has a permanent free tier.
