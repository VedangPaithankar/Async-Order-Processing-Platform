services:
  - type: web
    name: brewflow-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate
    preDeployCommand: npm run prisma:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: brewflow-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: brewflow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: brewflow-redis
          property: port

  - type: worker
    name: brewflow-worker
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: brewflow-api
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: brewflow-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: brewflow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: brewflow-redis
          property: port

  - type: keyvalue
    name: brewflow-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: brewflow-postgres
    databaseName: brewflow
    user: brewflow_user
