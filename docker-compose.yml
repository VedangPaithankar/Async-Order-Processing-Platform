services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Radhe
      POSTGRES_DB: backend-service

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:latest

    ports:
      - "6379:6379"


  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - redis


  worker:

    build:
      context: ./backend
      dockerfile: Dockerfile.worker

    env_file:
      - ./backend/.env

    depends_on:
      - backend
      - redis


  frontend:

    build:
      context: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:

  postgres_data: